name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build and validate Windows only
        type: boolean
        default: false

# 仅需要读取源码；工作流不使用账号凭据、不发布 Release、不写入仓库。
permissions:
  contents: read

jobs:
  native:
    if: ${{ !inputs.windows_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libx11-dev xvfb dbus-x11 rpm dpkg-dev
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Configure macOS universal app
        if: runner.os == 'macOS'
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Build native app and tests
        run: cmake --build build/native --parallel 2
      - name: Run native core and process tests
        run: ctest --test-dir build/native --output-on-failure
      - name: Verify Linux tray and X11 window following
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a dbus-run-session -- ./build/native/CodexQuotaStrip --smoke-test | tee build/native/ui-smoke.txt
      - name: Verify Wayland capability policy
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: wayland
        run: xvfb-run -a dbus-run-session -- ./build/native/CodexQuotaStrip --smoke-wayland
      - name: Verify Linux single instance across account homes
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash native/SingleInstanceTest.sh ./build/native/CodexQuotaStrip
      - name: Verify macOS menu bar and native UI
        if: runner.os == 'macOS'
        run: ./build/native/CodexQuotaStrip.app/Contents/MacOS/CodexQuotaStrip --smoke-test | tee build/native/ui-smoke.txt
      - name: Verify macOS single instance across account homes
        if: runner.os == 'macOS'
        run: bash native/SingleInstanceTest.sh ./build/native/CodexQuotaStrip.app/Contents/MacOS/CodexQuotaStrip
      - name: Package native artifacts
        run: |
          cd build/native
          cpack
          mkdir -p artifact
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp CodexQuotaStrip-linux-x86_64.deb CodexQuotaStrip-linux-x86_64.rpm CodexQuotaStrip-linux-x86_64.tar.gz artifact/
            mkdir portable-check
            tar -xzf CodexQuotaStrip-linux-x86_64.tar.gz -C portable-check
            bash ../../packaging/linux/Test-UserInstall.sh portable-check/CodexQuotaStrip-linux-x86_64 | tee user-installer-test.txt
            bash ../../packaging/linux/Test-UninstallPreservation.sh
            cp user-installer-test.txt artifact/
          else
            cp CodexQuotaStrip-macos-universal.zip artifact/
            # 检查打包后的 .app，确认资源复制没有破坏签名且包含两个架构。
            unzip -q CodexQuotaStrip-macos-universal.zip -d package-check
            codesign --verify --deep --strict package-check/CodexQuotaStrip-macos-universal/CodexQuotaStrip.app
            lipo package-check/CodexQuotaStrip-macos-universal/CodexQuotaStrip.app/Contents/MacOS/CodexQuotaStrip -verify_arch arm64 x86_64
            bash ../../packaging/macos/Build-Installers.sh "$PWD"
            bash ../../packaging/macos/Test-Installers.sh "$PWD" | tee installer-test.txt
            cp installer-test.txt artifact/
          fi
          cp ../../LICENSE artifact/
          cp ../../THIRD_PARTY_NOTICES.md artifact/
          cp ui-smoke.txt artifact/
          printf 'Repository: %s\nCommit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > artifact/BUILD-INFO.txt
          cd artifact
          if [ "${{ runner.os }}" = "Linux" ]; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
      - name: Upload native package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-quota-strip-${{ runner.os }}-native
          path: build/native/artifact/
          if-no-files-found: error
          retention-days: 14
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Windows x64
        run: ./Build.ps1
      - name: Run core and isolated UI tests
        run: ./Test.ps1 -Integration
      - name: Build Windows installation wizard
        run: ./scripts/Build-WindowsInstaller.ps1 -Version v3.0.0-preview.5 -OutputDirectory build/installers
      - name: Verify isolated install, upgrade and uninstall
        run: ./scripts/Test-WindowsInstaller.ps1 -Version v3.0.0-preview.5
      - name: Collect isolated installer diagnostics
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'build/installer-test-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          # TEMP 可能与工作目录不在同一磁盘，先复制明确的诊断文件到统一目录。
          foreach ($fixture in Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter 'CodexQuotaStrip-installer-*') {
            $destination = Join-Path $evidence $fixture.Name
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Get-ChildItem -LiteralPath $fixture.FullName -File |
              Where-Object { $_.Extension -eq '.log' -or $_.Name -eq 'test-results.json' } |
              Copy-Item -Destination $destination
          }
      - name: Save isolated installer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installer-test-evidence
          path: build/installer-test-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package artifact with license and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'build/package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          # 只打包明确列出的公开文件，避免混入测试数据和本机配置。
          foreach ($file in @('build/CodexQuotaStrip.exe', 'build/Start-With-Codex.ps1', 'LICENSE', 'THIRD_PARTY_NOTICES.md')) {
            Copy-Item -LiteralPath $file -Destination $package
          }
          Copy-Item -LiteralPath 'build/installers/CodexQuotaStrip-windows-x64-setup.exe' -Destination $package
          $provenance = "Repository: $env:GITHUB_REPOSITORY`nCommit: $env:GITHUB_SHA`nTarget: Windows x64`n"
          [IO.File]::WriteAllText((Join-Path $package 'BUILD-INFO.txt'), $provenance, [Text.UTF8Encoding]::new($false))
          $lines = foreach ($file in Get-ChildItem -LiteralPath $package -File | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hash + '  ' + $file.Name
          }
          [IO.File]::WriteAllLines((Join-Path $package 'SHA256SUMS.txt'), [string[]]$lines, [Text.UTF8Encoding]::new($false))
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-quota-strip-windows-x64
          path: build/package/
          if-no-files-found: error
          retention-days: 14
  linux-compatibility:
    needs: native
    if: ${{ always() && !cancelled() && !inputs.windows_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            format: deb
          - image: ubuntu:24.04
            format: deb
          - image: debian:12
            format: deb
          - image: fedora:43
            format: rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-quota-strip-Linux-native
          path: build/packages
      - name: Install release package on target distribution
        # 一次性容器内实际解析依赖、运行打包程序 UI smoke、重装和卸载。
        run: docker run --rm -v "$PWD:/repo:ro" '${{ matrix.image }}' bash /repo/packaging/linux/Test-Packages.sh /repo/build/packages '${{ matrix.format }}'
