name: Build Desktop

on:
  workflow_dispatch:

# 仅需要读取源码；工作流不使用账号凭据、不发布 Release、不写入仓库。
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libx11-dev xvfb dbus-x11
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Configure macOS universal app
        if: runner.os == 'macOS'
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Build native app and tests
        run: cmake --build build/native --parallel 2
      - name: Run native core and process tests
        run: ctest --test-dir build/native --output-on-failure
      - name: Verify Linux tray and X11 window following
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a dbus-run-session -- ./build/native/CodexQuotaStrip --smoke-test | tee build/native/ui-smoke.txt
      - name: Verify Wayland capability policy
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: wayland
        run: xvfb-run -a dbus-run-session -- ./build/native/CodexQuotaStrip --smoke-wayland
      - name: Verify Linux single instance across account homes
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- bash native/SingleInstanceTest.sh ./build/native/CodexQuotaStrip
      - name: Verify macOS menu bar and native UI
        if: runner.os == 'macOS'
        run: ./build/native/CodexQuotaStrip.app/Contents/MacOS/CodexQuotaStrip --smoke-test | tee build/native/ui-smoke.txt
      - name: Verify macOS single instance across account homes
        if: runner.os == 'macOS'
        run: bash native/SingleInstanceTest.sh ./build/native/CodexQuotaStrip.app/Contents/MacOS/CodexQuotaStrip
      - name: Package native artifacts
        run: |
          cd build/native
          cpack
          mkdir -p artifact
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp CodexQuotaStrip-linux-x86_64.deb CodexQuotaStrip-linux-x86_64.tar.gz artifact/
          else
            cp CodexQuotaStrip-macos-universal.zip artifact/
            # 检查打包后的 .app，确认资源复制没有破坏签名且包含两个架构。
            unzip -q CodexQuotaStrip-macos-universal.zip -d package-check
            codesign --verify --deep --strict package-check/CodexQuotaStrip-macos-universal/CodexQuotaStrip.app
            lipo -verify_arch arm64 x86_64 package-check/CodexQuotaStrip-macos-universal/CodexQuotaStrip.app/Contents/MacOS/CodexQuotaStrip
          fi
          cp ../../LICENSE artifact/
          cp ui-smoke.txt artifact/
          printf 'Repository: %s\nCommit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > artifact/BUILD-INFO.txt
          cd artifact
          if [ "${{ runner.os }}" = "Linux" ]; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
      - name: Upload native package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-quota-strip-${{ runner.os }}-native
          path: build/native/artifact/
          if-no-files-found: error
          retention-days: 14
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Windows x64
        run: ./Build.ps1
      - name: Run default tests
        run: ./Test.ps1
      - name: Package artifact with license and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'build/package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          # 只打包明确列出的公开文件，避免混入测试数据和本机配置。
          foreach ($file in @('build/CodexQuotaStrip.exe', 'build/Start-With-Codex.ps1', 'LICENSE')) {
            Copy-Item -LiteralPath $file -Destination $package
          }
          $provenance = "Repository: $env:GITHUB_REPOSITORY`nCommit: $env:GITHUB_SHA`nTarget: Windows x64`n"
          [IO.File]::WriteAllText((Join-Path $package 'BUILD-INFO.txt'), $provenance, [Text.UTF8Encoding]::new($false))
          $lines = foreach ($file in Get-ChildItem -LiteralPath $package -File | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hash + '  ' + $file.Name
          }
          [IO.File]::WriteAllLines((Join-Path $package 'SHA256SUMS.txt'), [string[]]$lines, [Text.UTF8Encoding]::new($false))
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-quota-strip-windows-x64
          path: build/package/
          if-no-files-found: error
          retention-days: 14
